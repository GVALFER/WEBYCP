openapi: 3.0.3
info:
    title: WEBYCP Public API
    version: 0.6.0
    description: Public REST API used by the WEBYCP web application.
paths:
    /api/v1/health:
        get:
            operationId: getHealth
            summary: Get API health
            responses:
                "200":
                    description: The API is healthy.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/HealthResponse"
    /api/v1/auth/login:
        post:
            operationId: login
            summary: Create an authenticated session
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Authenticated session.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResponse"
                "400":
                    $ref: "#/components/responses/BadRequestError"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/auth/logout:
        post:
            operationId: logout
            summary: Delete the current session
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "204":
                    description: Session deleted.
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/auth/me:
        get:
            operationId: getCurrentUser
            summary: Get the current authenticated user and CSRF token
            security:
                - cookieAuth: []
            responses:
                "200":
                    description: Current session.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResponse"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
    /api/v1/auth/profile:
        patch:
            operationId: updateProfile
            summary: Update the authenticated user's profile and password
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateProfileRequest"
            responses:
                "200":
                    description: Updated authenticated session.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResponse"
                "400":
                    $ref: "#/components/responses/BadRequestError"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "409":
                    $ref: "#/components/responses/ConflictError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/accounts:
        get:
            operationId: listAccounts
            summary: List accessible hosting accounts
            security:
                - cookieAuth: []
            responses:
                "200":
                    description: Hosting accounts.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccountListResponse"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "500":
                    $ref: "#/components/responses/InternalError"
        post:
            operationId: createAccount
            summary: Create and queue provisioning for a hosting account
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateAccountRequest"
            responses:
                "202":
                    description: Account provisioning queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccountJobResponse"
                "400":
                    $ref: "#/components/responses/BadRequestError"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "409":
                    $ref: "#/components/responses/ConflictError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/accounts/{accountId}:
        patch:
            operationId: setAccount
            summary: Enable or disable a hosting account
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/AccountID"
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateEnabledRequest"
            responses:
                "202":
                    description: Account operation queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccountJobResponse"
                "400": { $ref: "#/components/responses/BadRequestError" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "500": { $ref: "#/components/responses/InternalError" }
        delete:
            operationId: deleteAccount
            summary: Delete an empty hosting account and quarantine its home
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/AccountID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Account deletion queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccountJobResponse"
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/domains:
        get:
            operationId: listDomains
            summary: List accessible domains
            security:
                - cookieAuth: []
            responses:
                "200":
                    description: Domains.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainListResponse"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "500":
                    $ref: "#/components/responses/InternalError"
        post:
            operationId: createDomain
            summary: Create and queue provisioning for a domain
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateDomainRequest"
            responses:
                "202":
                    description: Domain provisioning queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainJobResponse"
                "400":
                    $ref: "#/components/responses/BadRequestError"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "409":
                    $ref: "#/components/responses/ConflictError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/domains/{domainId}:
        patch:
            operationId: setDomain
            summary: Update a domain hostname or enabled state
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/DomainID"
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateDomainRequest"
            responses:
                "202":
                    description: Domain operation queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainJobResponse"
                "400":
                    $ref: "#/components/responses/BadRequestError"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "409":
                    $ref: "#/components/responses/ConflictError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
        delete:
            operationId: deleteDomain
            summary: Delete a domain and quarantine its document root
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/DomainID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Domain deletion queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainJobResponse"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "409":
                    $ref: "#/components/responses/ConflictError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/domains/{domainId}/aliases:
        get:
            operationId: listDomainAliases
            summary: List aliases for an accessible domain
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/DomainID"
            responses:
                "200":
                    description: Domain aliases.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainAliasListResponse"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
        post:
            operationId: createDomainAlias
            summary: Create and queue provisioning for a domain alias
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/DomainID"
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateDomainAliasRequest"
            responses:
                "202":
                    description: Domain alias provisioning queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainAliasJobResponse"
                "400":
                    $ref: "#/components/responses/BadRequestError"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "409":
                    $ref: "#/components/responses/ConflictError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/domains/{domainId}/aliases/{aliasId}:
        patch:
            operationId: setDomainAlias
            summary: Update a domain alias hostname or enabled state
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/DomainID"
                - $ref: "#/components/parameters/AliasID"
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateDomainRequest"
            responses:
                "202":
                    description: Domain alias operation queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainAliasJobResponse"
                "400":
                    $ref: "#/components/responses/BadRequestError"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "409":
                    $ref: "#/components/responses/ConflictError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
        delete:
            operationId: deleteDomainAlias
            summary: Delete a domain alias
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/DomainID"
                - $ref: "#/components/parameters/AliasID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Domain alias deletion queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DomainAliasJobResponse"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "409":
                    $ref: "#/components/responses/ConflictError"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/certificates:
        get:
            operationId: listCertificates
            summary: List accessible certificates
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Certificates.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CertificateListResponse"
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/domains/{domainId}/certificate:
        post:
            operationId: issueDomainCertificate
            summary: Issue a certificate for a domain and eligible aliases
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/DomainID"
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/IssueCertificateRequest"
            responses:
                "202":
                    description: Certificate issuance queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CertificateJobResponse"
                "400": { $ref: "#/components/responses/BadRequestError" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "422": { $ref: "#/components/responses/ValidationError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/certificates/panel:
        post:
            operationId: issuePanelCertificate
            summary: Bootstrap or renew the panel certificate
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/IssuePanelCertificateRequest"
            responses:
                "202":
                    description: Panel certificate issuance queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CertificateJobResponse"
                "400": { $ref: "#/components/responses/BadRequestError" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "422": { $ref: "#/components/responses/ValidationError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/certificates/{certificateId}/renew:
        post:
            operationId: renewCertificate
            summary: Renew a certificate now
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/CertificateID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Renewal queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CertificateJobResponse"
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/certificates/{certificateId}:
        patch:
            operationId: setCertificate
            summary: Set the HTTPS redirect policy
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/CertificateID"
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateCertificateRequest"
            responses:
                "202":
                    description: Certificate configuration queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CertificateJobResponse"
                "400": { $ref: "#/components/responses/BadRequestError" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/databases:
        get:
            operationId: listDatabases
            summary: List accessible MySQL databases
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Databases.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DatabaseListResponse" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "500": { $ref: "#/components/responses/InternalError" }
        post:
            operationId: createDatabase
            summary: Create a MySQL database
            security: [{ cookieAuth: [] }]
            parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateDatabaseRequest" }
            responses:
                "202":
                    description: Database creation queued.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DatabaseJobResponse" }
                "400": { $ref: "#/components/responses/BadRequestError" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "422": { $ref: "#/components/responses/ValidationError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/databases/{databaseId}:
        delete:
            operationId: deleteDatabase
            summary: Delete a MySQL database
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/DatabaseID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Database deletion queued.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DatabaseJobResponse" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/database-users:
        get:
            operationId: listDatabaseUsers
            summary: List accessible MySQL users
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Database users.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DatabaseUserListResponse" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "500": { $ref: "#/components/responses/InternalError" }
        post:
            operationId: createDatabaseUser
            summary: Create a MySQL user and reveal its generated password once
            security: [{ cookieAuth: [] }]
            parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateDatabaseUserRequest" }
            responses:
                "202":
                    description: Database user creation queued.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DatabaseUserJobResponse" }
                "400": { $ref: "#/components/responses/BadRequestError" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "422": { $ref: "#/components/responses/ValidationError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/database-users/{databaseUserId}:
        delete:
            operationId: deleteDatabaseUser
            summary: Delete a MySQL user
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/DatabaseUserID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Database user deletion queued.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DatabaseUserJobResponse" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/database-grants:
        get:
            operationId: listDatabaseGrants
            summary: List accessible grants
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Database grants.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DatabaseGrantListResponse" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/databases/{databaseId}/users/{databaseUserId}:
        put:
            operationId: createDatabaseGrant
            summary: Grant a user access to a database in the same account
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/DatabaseID"
                - $ref: "#/components/parameters/DatabaseUserID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Grant creation queued.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DatabaseGrantJobResponse" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "500": { $ref: "#/components/responses/InternalError" }
        delete:
            operationId: deleteDatabaseGrant
            summary: Revoke a user's access to a database
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/DatabaseID"
                - $ref: "#/components/parameters/DatabaseUserID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Grant deletion queued.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DatabaseGrantJobResponse" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "409": { $ref: "#/components/responses/ConflictError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/cron-jobs:
        get:
            operationId: listCronJobs
            summary: List accessible cron jobs
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Cron jobs.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CronJobListResponse" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "500": { $ref: "#/components/responses/InternalError" }
        post:
            operationId: createCronJob
            summary: Create and synchronize a cron job
            security: [{ cookieAuth: [] }]
            parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/WriteCronJobRequest" }
            responses:
                "202":
                    description: Cron synchronization queued.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CronJobResponse" }
                "400": { $ref: "#/components/responses/BadRequestError" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "422": { $ref: "#/components/responses/ValidationError" }
