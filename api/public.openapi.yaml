            summary: List accessible backup runs
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Backup runs.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BackupRunListResponse" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
