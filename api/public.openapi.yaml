                "200":
                    description: Restore preview.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BackupManifest" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "500": { $ref: "#/components/responses/InternalError" }
        post:
            operationId: restoreBackup
            summary: Restore selected scopes from a verified artifact
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/BackupArtifactID"
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/RestoreBackupRequest" }
            responses:
                "202":
                    description: Restore queued.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/Job" }
                "400": { $ref: "#/components/responses/BadRequestError" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "422": { $ref: "#/components/responses/ValidationError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/backup-artifacts/{backupArtifactId}:
        delete:
            operationId: deleteBackupArtifact
            summary: Delete one local backup artifact
            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/BackupArtifactID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "204": { description: Backup artifact deleted. }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "404": { $ref: "#/components/responses/NotFoundError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/nodes:
        get:
            operationId: listNodes
            summary: List managed nodes
            security:
                - cookieAuth: []
            responses:
                "200":
                    description: Managed nodes.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/NodeListResponse"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/nodes/{nodeId}/probe:
        post:
            operationId: probeNode
            summary: Queue a node connectivity probe
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/NodeID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Probe queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Job"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/jobs:
        get:
            operationId: listJobs
            summary: List recent jobs
            security:
                - cookieAuth: []
            responses:
                "200":
                    description: Recent jobs.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobListResponse"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/jobs/{jobId}:
        get:
            operationId: getJob
            summary: Get a job and its steps
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/JobID"
            responses:
                "200":
                    description: Job details.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobDetail"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "500":
                    $ref: "#/components/responses/InternalError"
components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: webycp_session
    parameters:
        CSRFToken:
            name: X-CSRF-Token
            in: header
            required: true
            schema:
                type: string
        NodeID:
            name: nodeId
            in: path
            required: true
            schema:
                type: string
        JobID:
            name: jobId
            in: path
            required: true
            schema:
                type: string
        DomainID:
            name: domainId
            in: path
            required: true
            schema:
                type: string
        AliasID:
            name: aliasId
            in: path
            required: true
            schema:
                type: string
        AccountID:
            name: accountId
            in: path
            required: true
            schema: { type: string }
        CertificateID:
            name: certificateId
            in: path
            required: true
            schema: { type: string }
        DatabaseID:
            name: databaseId
            in: path
            required: true
            schema: { type: string }
        DatabaseUserID:
            name: databaseUserId
            in: path
            required: true
            schema: { type: string }
        CronJobID:
            name: cronJobId
            in: path
            required: true
            schema: { type: string }
        BackupPlanID:
            name: backupPlanId
            in: path
            required: true
            schema: { type: string }
        BackupArtifactID:
            name: backupArtifactId
            in: path
            required: true
            schema: { type: string }
    responses:
        BadRequestError:
            description: The request body is malformed.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        UnauthorizedError:
            description: Authentication is required.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ForbiddenError:
            description: The request is not allowed.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        NotFoundError:
            description: The resource does not exist.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ConflictError:
            description: The request conflicts with current state.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ValidationError:
            description: The request is invalid.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        InternalError:
            description: An internal error occurred.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
    schemas:
        HealthResponse:
            type: object
            additionalProperties: false
            required: [service, status, version]
            properties:
                service:
                    type: string
                    example: webycp-server
                status:
                    type: string
                    enum: [ok]
                version:
                    type: string
                    example: dev
        LoginRequest:
            type: object
            additionalProperties: false
            required: [username, password]
            properties:
                username:
                    type: string
                    minLength: 3
                    maxLength: 32
                password:
                    type: string
        UpdateProfileRequest:
            type: object
            additionalProperties: false
            required: [username, name, email, timezone]
            properties:
                username:
                    type: string
                    minLength: 3
                    maxLength: 32
                name:
                    type: string
                    minLength: 2
                    maxLength: 80
                email:
                    type: string
                    format: email
                timezone:
                    type: string
                    minLength: 1
                    maxLength: 64
                currentPassword:
                    type: string
                    maxLength: 128
                password:
                    type: string
                    maxLength: 128
        AuthResponse:
            type: object
            additionalProperties: false
            required: [user, csrfToken, expiresAt, timezone]
            properties:
                user:
                    $ref: "#/components/schemas/User"
                csrfToken:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
                timezone:
                    type: string
        User:
            type: object
            additionalProperties: false
            required: [id, username, email, name, role, mustChangePassword, createdAt]
            properties:
                id:
                    type: string
                username:
                    type: string
                email:
                    type: string
                    format: email
                name:
                    type: string
                role:
                    type: string
                    enum: [admin, user]
                mustChangePassword:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
        Node:
            type: object
            additionalProperties: false
            required: [id, name, kind, endpoint, status, createdAt, updatedAt]
            properties:
                id:
                    type: string
                name:
                    type: string
                kind:
                    type: string
                    enum: [local, remote]
                endpoint:
                    type: string
                status:
                    type: string
                    enum: [unknown, online, offline]
                lastSeenAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        Account:
            type: object
            additionalProperties: false
            required: [id, nodeId, name, systemUser, status, enabled, createdAt, updatedAt]
            properties:
                id:
                    type: string
                nodeId:
                    type: string
                name:
                    type: string
                systemUser:
                    type: string
                status:
                    type: string
                    enum: [pending, active, disabled, error]
                enabled:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        CreateAccountRequest:
            type: object
            additionalProperties: false
            required: [name, nodeId]
            properties:
                name:
                    type: string
                    minLength: 2
                    maxLength: 80
                nodeId:
                    type: string
        AccountListResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Account"
        AccountJobResponse:
            type: object
            additionalProperties: false
            required: [account, job]
            properties:
                account:
                    $ref: "#/components/schemas/Account"
                job:
                    $ref: "#/components/schemas/Job"
        UpdateEnabledRequest:
            type: object
            additionalProperties: false
            required: [enabled]
            properties:
                enabled: { type: boolean }
        Domain:
            type: object
            additionalProperties: false
            required:
                [id, accountId, nodeId, name, status, phpVersion, enabled, createdAt, updatedAt]
            properties:
                id:
                    type: string
                accountId:
                    type: string
                nodeId:
                    type: string
                name:
                    type: string
                status:
                    type: string
                    enum: [pending, active, disabled, error]
                phpVersion:
                    type: string
                enabled:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        CreateDomainRequest:
            type: object
            additionalProperties: false
            required: [accountId, name]
            properties:
                accountId:
                    type: string
                name:
                    type: string
                    minLength: 4
                    maxLength: 253
        DomainListResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Domain"
        DomainJobResponse:
            type: object
            additionalProperties: false
            required: [domain, job]
            properties:
                domain:
                    $ref: "#/components/schemas/Domain"
                job:
                    $ref: "#/components/schemas/Job"
        DomainAlias:
            type: object
            additionalProperties: false
            required: [id, domainId, name, status, enabled, createdAt, updatedAt]
            properties:
                id:
                    type: string
                domainId:
                    type: string
                name:
                    type: string
                status:
                    type: string
                    enum: [pending, active, disabled, error]
                enabled:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        CreateDomainAliasRequest:
            type: object
            additionalProperties: false
            required: [name]
            properties:
                name:
                    type: string
                    minLength: 4
                    maxLength: 253
        UpdateDomainRequest:
            type: object
            additionalProperties: false
            minProperties: 1
            maxProperties: 1
            properties:
                enabled:
                    type: boolean
                name:
                    type: string
                    minLength: 4
                    maxLength: 253
        DomainAliasListResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/DomainAlias"
        DomainAliasJobResponse:
            type: object
            additionalProperties: false
            required: [alias, job]
            properties:
                alias:
                    $ref: "#/components/schemas/DomainAlias"
                job:
                    $ref: "#/components/schemas/Job"
        NodeListResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Node"
        Job:
            type: object
            additionalProperties: false
            required: [id, kind, status, payload, attempts, maxAttempts, createdAt]
            properties:
                id:
                    type: string
                nodeId:
                    type: string
                    nullable: true
                userId:
                    type: string
                    nullable: true
                kind:
                    type: string
                status:
                    type: string
                    enum: [queued, running, succeeded, failed]
                payload:
                    type: object
                    additionalProperties: true
                attempts:
                    type: integer
                    format: int64
                maxAttempts:
                    type: integer
                    format: int64
                error:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                startedAt:
                    type: string
                    format: date-time
                    nullable: true
                finishedAt:
                    type: string
                    format: date-time
                    nullable: true
        JobStep:
            type: object
            additionalProperties: false
            required: [id, name, status, message, startedAt]
            properties:
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
                    enum: [running, succeeded, failed]
                message:
                    type: string
                startedAt:
                    type: string
                    format: date-time
                finishedAt:
                    type: string
                    format: date-time
                    nullable: true
        JobDetail:
            type: object
            additionalProperties: false
            required: [job, steps]
            properties:
                job:
                    $ref: "#/components/schemas/Job"
                steps:
                    type: array
                    items:
                        $ref: "#/components/schemas/JobStep"
        JobListResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Job"
        Certificate:
            type: object
            additionalProperties: false
            required:
                [
                    id,
                    nodeId,
                    kind,
                    name,
                    names,
                    email,
                    status,
                    redirectHttps,
                    error,
                    createdAt,
                    updatedAt,
                ]
            properties:
                id: { type: string }
                domainId: { type: string, nullable: true }
                nodeId: { type: string }
                kind: { type: string, enum: [domain, panel] }
                name: { type: string }
                names:
                    type: array
                    items: { type: string }
                email: { type: string, format: email }
                status: { type: string, enum: [pending, active, error] }
                redirectHttps: { type: boolean }
                expiresAt: { type: string, format: date-time, nullable: true }
                error: { type: string }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        IssueCertificateRequest:
            type: object
            additionalProperties: false
            required: [email]
            properties:
                email: { type: string, format: email }
        IssuePanelCertificateRequest:
            type: object
            additionalProperties: false
            required: [hostname, email]
            properties:
                hostname: { type: string }
                email: { type: string, format: email }
        UpdateCertificateRequest:
            type: object
            additionalProperties: false
            required: [redirectHttps]
            properties:
                redirectHttps: { type: boolean }
        CertificateListResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items: { $ref: "#/components/schemas/Certificate" }
        CertificateJobResponse:
            type: object
            additionalProperties: false
            required: [certificate, job]
            properties:
                certificate: { $ref: "#/components/schemas/Certificate" }
                job: { $ref: "#/components/schemas/Job" }
        Database:
            type: object
            additionalProperties: false
            required: [id, accountId, nodeId, name, systemName, status, createdAt, updatedAt]
            properties:
                id: { type: string }
                accountId: { type: string }
                nodeId: { type: string }
                name: { type: string }
                systemName: { type: string }
                status: { type: string, enum: [pending, active, error] }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        DatabaseUser:
            type: object
            additionalProperties: false
            required: [id, accountId, nodeId, name, systemName, status, createdAt, updatedAt]
            properties:
                id: { type: string }
                accountId: { type: string }
                nodeId: { type: string }
                name: { type: string }
                systemName: { type: string }
                status: { type: string, enum: [pending, active, error] }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        DatabaseGrant:
            type: object
            additionalProperties: false
            required: [databaseId, databaseUserId, status, createdAt, updatedAt]
            properties:
                databaseId: { type: string }
                databaseUserId: { type: string }
                status: { type: string, enum: [pending, active, error] }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        CreateDatabaseRequest:
            type: object
            additionalProperties: false
            required: [accountId, name]
