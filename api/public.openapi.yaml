    /api/v1/backup-artifacts:
        get:
            operationId: listBackupArtifacts
            summary: List accessible verified artifacts
            security: [{ cookieAuth: [] }]
            responses:
                "200":
                    description: Backup artifacts.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BackupArtifactListResponse" }
