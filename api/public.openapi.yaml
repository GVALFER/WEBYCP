            security: [{ cookieAuth: [] }]
            parameters:
                - $ref: "#/components/parameters/CSRFToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ServiceDefaults" }
            responses:
                "200":
                    description: Updated service defaults.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ServiceSettings" }
                "400": { $ref: "#/components/responses/BadRequestError" }
                "401": { $ref: "#/components/responses/UnauthorizedError" }
                "403": { $ref: "#/components/responses/ForbiddenError" }
                "422": { $ref: "#/components/responses/ValidationError" }
                "500": { $ref: "#/components/responses/InternalError" }
    /api/v1/nodes/{nodeId}/probe:
        post:
            operationId: probeNode
            summary: Queue a node connectivity probe
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/NodeID"
                - $ref: "#/components/parameters/CSRFToken"
            responses:
                "202":
                    description: Probe queued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Job"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/jobs:
        get:
            operationId: listJobs
            summary: List recent jobs
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/Page"
                - $ref: "#/components/parameters/PageSize"
            responses:
                "200":
                    description: Recent jobs.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobListResponse"
                "400":
                    $ref: "#/components/responses/BadRequestError"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "500":
                    $ref: "#/components/responses/InternalError"
    /api/v1/jobs/{jobId}:
        get:
            operationId: getJob
            summary: Get a job and its steps
            security:
                - cookieAuth: []
            parameters:
                - $ref: "#/components/parameters/JobID"
            responses:
                "200":
                    description: Job details.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobDetail"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "500":
                    $ref: "#/components/responses/InternalError"
components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: webycp_session
    parameters:
        Page:
            name: page
            in: query
            schema:
                type: integer
                minimum: 1
                default: 1
        PageSize:
            name: size
            in: query
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 10
        CSRFToken:
            name: X-CSRF-Token
            in: header
            required: true
            schema:
                type: string
        NodeID:
            name: nodeId
            in: path
            required: true
            schema:
                type: string
        JobID:
            name: jobId
            in: path
            required: true
            schema:
                type: string
        WebsiteID:
            name: websiteId
            in: path
            required: true
            schema:
                type: string
        WebsiteDomainID:
            name: websiteDomainId
            in: path
            required: true
            schema:
                type: string
        AccountID:
            name: accountId
            in: path
            required: true
            schema: { type: string }
        PackageID:
            name: packageId
            in: path
            required: true
            schema: { type: string }
        CertificateID:
            name: certificateId
            in: path
            required: true
            schema: { type: string }
        DatabaseID:
            name: databaseId
            in: path
            required: true
            schema: { type: string }
        DatabaseUserID:
            name: databaseUserId
            in: path
            required: true
            schema: { type: string }
        CronJobID:
            name: cronJobId
            in: path
            required: true
            schema: { type: string }
        BackupPlanID:
            name: backupPlanId
            in: path
            required: true
            schema: { type: string }
        BackupArtifactID:
            name: backupArtifactId
            in: path
            required: true
            schema: { type: string }
        DNSZoneID:
            name: dnsZoneId
            in: path
            required: true
            schema: { type: string }
        DNSRecordID:
            name: dnsRecordId
            in: path
            required: true
            schema: { type: string }
    responses:
        BadRequestError:
            description: The request is malformed.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        UnauthorizedError:
            description: Authentication is required.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ForbiddenError:
            description: The request is not allowed.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        NotFoundError:
            description: The resource does not exist.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ConflictError:
            description: The request conflicts with current state.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ValidationError:
            description: The request is invalid.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        InternalError:
            description: An internal error occurred.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
    schemas:
        HealthResponse:
            type: object
            additionalProperties: false
            required: [service, status, version]
            properties:
                service:
                    type: string
                    example: webycp-server
                status:
                    type: string
                    enum: [ok]
                version:
                    type: string
                    example: dev
        LoginRequest:
            type: object
            additionalProperties: false
            required: [username, password]
            properties:
                username:
                    type: string
                    minLength: 3
                    maxLength: 32
                password:
                    type: string
        UpdateProfileRequest:
            type: object
            additionalProperties: false
            required: [username, name, email, timezone]
            properties:
                username:
                    type: string
                    minLength: 3
                    maxLength: 32
                name:
                    type: string
                    minLength: 2
                    maxLength: 80
                email:
                    type: string
                    format: email
                timezone:
                    type: string
                    minLength: 1
                    maxLength: 64
                currentPassword:
                    type: string
                    maxLength: 128
                password:
                    type: string
                    maxLength: 128
        AuthResponse:
            type: object
            additionalProperties: false
            required: [user, csrfToken, expiresAt, timezone]
            properties:
                user:
                    $ref: "#/components/schemas/User"
                csrfToken:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
                timezone:
                    type: string
        User:
            type: object
            additionalProperties: false
            required: [id, username, email, name, role, mustChangePassword, createdAt]
            properties:
                id:
                    type: string
                username:
                    type: string
                email:
                    type: string
                    format: email
                name:
                    type: string
                role:
                    type: string
                    enum: [admin, user]
                mustChangePassword:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
        Node:
            type: object
            additionalProperties: false
            required:
                [
                    id,
                    name,
                    kind,
                    endpoint,
                    status,
                    capabilities,
                    capabilitiesAt,
                    createdAt,
                    updatedAt,
                ]
            properties:
                id:
                    type: string
                name:
                    type: string
                kind:
                    type: string
                    enum: [local, remote]
                endpoint:
                    type: string
                status:
                    type: string
                    enum: [unknown, online, offline]
                lastSeenAt:
                    type: string
                    format: date-time
                    nullable: true
                capabilities:
                    nullable: true
                    allOf:
                        - $ref: "#/components/schemas/ServiceCapabilities"
                capabilitiesAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        ServiceCapability:
            type: object
            additionalProperties: false
            required: [driver, version, status]
            properties:
                driver: { type: string }
                version: { type: string }
                status: { type: string, enum: [healthy, unavailable] }
        ServiceCapabilities:
            type: object
            additionalProperties: false
            required: [webservers, runtimes, databases, schedulers, backups, dns]
            properties:
                webservers:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCapability" }
                runtimes:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCapability" }
                databases:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCapability" }
                schedulers:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCapability" }
                backups:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCapability" }
                dns:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCapability" }
        ServiceDefaults:
            type: object
            additionalProperties: false
            required:
                [
                    webDriver,
                    runtimeDriver,
                    runtimeVersion,
                    databaseDriver,
                    schedulerDriver,
                    backupDriver,
                ]
            properties:
                webDriver: { type: string, enum: [nginx] }
                runtimeDriver: { type: string, enum: [phpfpm] }
                runtimeVersion: { type: string, enum: ["8.3"] }
                databaseDriver: { type: string, enum: [mysql] }
                schedulerDriver: { type: string, enum: [crontab] }
                backupDriver: { type: string, enum: [local] }
        ServiceSettings:
            type: object
            additionalProperties: false
            required: [defaults, updatedAt]
            properties:
                defaults: { $ref: "#/components/schemas/ServiceDefaults" }
                updatedAt: { type: string, format: date-time }
        Account:
            type: object
            additionalProperties: false
            required: [id, nodeId, name, systemUser, status, enabled, createdAt, updatedAt]
            properties:
                id:
                    type: string
                nodeId:
                    type: string
                name:
                    type: string
                systemUser:
                    type: string
                status:
                    type: string
                    enum: [pending, active, disabled, error]
                enabled:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        CreateAccountRequest:
            type: object
            additionalProperties: false
            required: [name, nodeId, packageId]
            properties:
                name:
                    type: string
                    minLength: 2
                    maxLength: 80
                nodeId:
                    type: string
                packageId:
                    type: string
        AssignAccountPackageRequest:
            type: object
            additionalProperties: false
            required: [packageId]
            properties:
                packageId: { type: string }
        PackageLimits:
            type: object
            additionalProperties: false
            required:
                [
                    websites,
                    domains,
                    aliases,
                    databases,
                    databaseUsers,
                    scheduledTasks,
                    backupPlans,
                    backupRetention,
                ]
            properties:
                websites: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
                domains: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
                aliases: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
                databases: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
                databaseUsers: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
                scheduledTasks: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
                backupPlans: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
                backupRetention: { type: integer, format: int64, minimum: 1, maximum: 100 }
        PackageUsage:
            type: object
            additionalProperties: false
            required:
                [websites, domains, aliases, databases, databaseUsers, scheduledTasks, backupPlans]
            properties:
                websites: { type: integer, format: int64, minimum: 0 }
                domains: { type: integer, format: int64, minimum: 0 }
                aliases: { type: integer, format: int64, minimum: 0 }
                databases: { type: integer, format: int64, minimum: 0 }
                databaseUsers: { type: integer, format: int64, minimum: 0 }
                scheduledTasks: { type: integer, format: int64, minimum: 0 }
                backupPlans: { type: integer, format: int64, minimum: 0 }
        Package:
            type: object
            additionalProperties: false
            required: [id, name, limits, accountCount, createdAt, updatedAt]
            properties:
                id: { type: string }
                name: { type: string }
                limits: { $ref: "#/components/schemas/PackageLimits" }
                accountCount: { type: integer, format: int64, minimum: 0 }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        WritePackageRequest:
            type: object
            additionalProperties: false
            required: [name, limits]
            properties:
                name:
                    type: string
                    minLength: 2
                    maxLength: 80
                limits: { $ref: "#/components/schemas/PackageLimits" }
        AccountOverview:
            type: object
            additionalProperties: false
            required:
                [
                    id,
                    nodeId,
                    name,
                    systemUser,
                    status,
                    enabled,
                    createdAt,
                    updatedAt,
                    package,
                    usage,
                ]
            properties:
                id: { type: string }
                nodeId: { type: string }
                name: { type: string }
                systemUser: { type: string }
                status:
                    type: string
                    enum: [pending, active, disabled, error]
                enabled: { type: boolean }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
                package: { $ref: "#/components/schemas/Package" }
                usage: { $ref: "#/components/schemas/PackageUsage" }
        PackageListResponse:
            type: object
            additionalProperties: false
            required: [items, pagination]
            properties:
                items:
                    type: array
                    items: { $ref: "#/components/schemas/Package" }
                pagination: { $ref: "#/components/schemas/Pagination" }
        AccountListResponse:
            type: object
            additionalProperties: false
            required: [items, pagination]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/AccountOverview"
                pagination:
                    $ref: "#/components/schemas/Pagination"
        Pagination:
            type: object
            additionalProperties: false
            required: [page, size, totalItems, totalPages]
            properties:
                page:
                    type: integer
                    minimum: 1
                size:
                    type: integer
                    minimum: 1
                    maximum: 100
                totalItems:
                    type: integer
                    format: int64
                    minimum: 0
                totalPages:
                    type: integer
                    minimum: 0
        AccountJobResponse:
            type: object
            additionalProperties: false
            required: [account, job]
            properties:
                account:
                    $ref: "#/components/schemas/Account"
                job:
                    $ref: "#/components/schemas/Job"
        DNSProvider:
            type: object
            additionalProperties: false
            required: [id, nodeId, name, driver, status, createdAt, updatedAt]
            properties:
                id: { type: string }
                nodeId: { type: string }
                name: { type: string }
                driver: { type: string, enum: [powerdns] }
                status: { type: string, enum: [healthy, unavailable, unknown] }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        DNSProviderListResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items: { $ref: "#/components/schemas/DNSProvider" }
        DNSSettings:
            type: object
            additionalProperties: false
            required: [primaryNameserver, secondaryNameserver, defaultTtl, updatedAt]
            properties:
                primaryNameserver: { type: string }
                secondaryNameserver: { type: string }
                defaultTtl: { type: integer, format: int64, minimum: 60, maximum: 86400 }
                updatedAt: { type: string, format: date-time }
        UpdateDNSSettingsRequest:
            type: object
            additionalProperties: false
            required: [primaryNameserver, secondaryNameserver, defaultTtl]
            properties:
                primaryNameserver: { type: string, maxLength: 253 }
                secondaryNameserver: { type: string, maxLength: 253 }
                defaultTtl: { type: integer, format: int64, minimum: 60, maximum: 86400 }
        DNSZone:
            type: object
            additionalProperties: false
            required:
                [id, accountId, nodeId, providerId, name, nameservers, status, createdAt, updatedAt]
            properties:
                id: { type: string }
                accountId: { type: string }
                nodeId: { type: string }
                providerId: { type: string }
                name: { type: string }
                nameservers:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items: { type: string }
                status: { type: string, enum: [pending, active, deleting, error] }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        CreateDNSZoneRequest:
            type: object
            additionalProperties: false
            required: [accountId, providerId, name]
            properties:
                accountId: { type: string }
                providerId: { type: string }
                name: { type: string, minLength: 4, maxLength: 253 }
        DNSZoneListResponse:
            type: object
            additionalProperties: false
            required: [items, pagination]
            properties:
                items:
                    type: array
                    items: { $ref: "#/components/schemas/DNSZone" }
                pagination: { $ref: "#/components/schemas/Pagination" }
        DNSZoneJobResponse:
            type: object
            additionalProperties: false
            required: [zone, job]
            properties:
                zone: { $ref: "#/components/schemas/DNSZone" }
                job: { $ref: "#/components/schemas/Job" }
        DNSRecord:
            type: object
            additionalProperties: false
            required: [id, zoneId, name, type, content, ttl, priority, status, createdAt, updatedAt]
            properties:
                id: { type: string }
                zoneId: { type: string }
                name: { type: string }
                type: { type: string, enum: [A, AAAA, CNAME, MX, TXT] }
                content: { type: string }
                ttl: { type: integer, format: int64 }
                priority: { type: integer, format: int64 }
                status: { type: string, enum: [pending, active, deleting, error] }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        WriteDNSRecordRequest:
            type: object
            additionalProperties: false
            required: [name, type, content, ttl, priority]
            properties:
                name: { type: string, minLength: 1, maxLength: 253 }
                type: { type: string, enum: [A, AAAA, CNAME, MX, TXT] }
                content: { type: string, minLength: 1, maxLength: 1000 }
                ttl: { type: integer, format: int64, minimum: 60, maximum: 86400 }
                priority: { type: integer, format: int64, minimum: 0, maximum: 65535 }
        DNSRecordListResponse:
            type: object
            additionalProperties: false
            required: [items, pagination]
            properties:
                items:
                    type: array
                    items: { $ref: "#/components/schemas/DNSRecord" }
                pagination: { $ref: "#/components/schemas/Pagination" }
        DNSRecordJobResponse:
            type: object
            additionalProperties: false
            required: [record, job]
            properties:
                record: { $ref: "#/components/schemas/DNSRecord" }
                job: { $ref: "#/components/schemas/Job" }
        UpdateEnabledRequest:
            type: object
            additionalProperties: false
            required: [enabled]
            properties:
                enabled: { type: boolean }
        Website:
            type: object
            additionalProperties: false
            required:
                [
                    id,
                    accountId,
                    nodeId,
                    name,
                    kind,
                    documentRoot,
                    webDriver,
                    runtimeDriver,
                    runtimeVersion,
                    status,
                    enabled,
                    createdAt,
                    updatedAt,
                ]
            properties:
                id: { type: string }
                accountId: { type: string }
                nodeId: { type: string }
                name: { type: string }
                kind: { type: string, enum: [php] }
                documentRoot: { type: string }
                webDriver: { type: string, enum: [nginx] }
                runtimeDriver: { type: string, enum: [phpfpm] }
                runtimeVersion: { type: string, enum: ["8.3"] }
                status:
                    type: string
                    enum: [pending, active, disabled, error]
                enabled:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        CreateWebsiteRequest:
            type: object
            additionalProperties: false
            required:
                [accountId, name, primaryDomain, kind, webDriver, runtimeDriver, runtimeVersion]
            properties:
                accountId: { type: string }
                name:
                    type: string
                    minLength: 1
                    maxLength: 80
                primaryDomain:
                    type: string
                    minLength: 4
                    maxLength: 253
                kind: { type: string, enum: [php] }
                webDriver: { type: string, enum: [nginx] }
                runtimeDriver: { type: string, enum: [phpfpm] }
                runtimeVersion: { type: string, enum: ["8.3"] }
        WebsiteListResponse:
            type: object
            additionalProperties: false
            required: [items, pagination]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Website"
                pagination:
                    $ref: "#/components/schemas/Pagination"
        WebsiteJobResponse:
            type: object
            additionalProperties: false
            required: [website, job]
            properties:
                website:
                    $ref: "#/components/schemas/Website"
                job:
                    $ref: "#/components/schemas/Job"
        WebsiteDomain:
            type: object
            additionalProperties: false
            required: [id, websiteId, hostname, kind, status, enabled, createdAt, updatedAt]
            properties:
                id:
                    type: string
                websiteId:
                    type: string
                hostname: { type: string }
                kind: { type: string, enum: [primary, alias] }
                status:
                    type: string
                    enum: [pending, active, disabled, error]
                enabled:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        CreateWebsiteDomainRequest:
            type: object
            additionalProperties: false
            required: [hostname]
            properties:
                hostname:
                    type: string
                    minLength: 4
                    maxLength: 253
        UpdateWebsiteRequest:
            type: object
            additionalProperties: false
            required: [enabled]
            properties:
                enabled: { type: boolean }
        UpdateWebsiteDomainRequest:
            type: object
            additionalProperties: false
            minProperties: 1
            maxProperties: 1
            properties:
                enabled: { type: boolean }
                hostname:
                    type: string
                    minLength: 4
                    maxLength: 253
        WebsiteDomainListResponse:
            type: object
            additionalProperties: false
            required: [items, pagination]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/WebsiteDomain"
                pagination:
                    $ref: "#/components/schemas/Pagination"
        WebsiteDomainCollection:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/WebsiteDomain"
        WebsiteDomainJobResponse:
            type: object
            additionalProperties: false
            required: [domain, job]
            properties:
                domain:
                    $ref: "#/components/schemas/WebsiteDomain"
                job:
                    $ref: "#/components/schemas/Job"
        NodeListResponse:
            type: object
            additionalProperties: false
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Node"
        Job:
            type: object
            additionalProperties: false
            required: [id, kind, status, payload, attempts, maxAttempts, createdAt]
            properties:
                id:
                    type: string
                nodeId:
                    type: string
                    nullable: true
                userId:
                    type: string
                    nullable: true
                kind:
                    type: string
                status:
                    type: string
                    enum: [queued, running, succeeded, failed]
                payload:
                    type: object
                    additionalProperties: true
                attempts:
                    type: integer
                    format: int64
                maxAttempts:
                    type: integer
                    format: int64
                error:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                startedAt:
                    type: string
                    format: date-time
                    nullable: true
                finishedAt:
                    type: string
                    format: date-time
                    nullable: true
        JobStep:
            type: object
            additionalProperties: false
            required: [id, name, status, message, startedAt]
            properties:
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
                    enum: [running, succeeded, failed]
                message:
                    type: string
                startedAt:
                    type: string
                    format: date-time
