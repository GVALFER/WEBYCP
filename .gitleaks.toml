[extend]
useDefault = true

[[allowlists]]
description = "Next.js generated build keys"
paths = [
  '''(^|/)web/\.next/(dev/)?cache/\.(previewinfo|rscinfo)$''',
  '''(^|/)web/\.next/(dev/|standalone/\.next/)?prerender-manifest\.json$''',
  '''(^|/)web/\.next/(dev/|standalone/\.next/)?server/server-reference-manifest\.json$''',
]

[[allowlists]]
description = "Minified keyboard modifier false positive"
regexTarget = "match"
regexes = ['''r\.metaKey,''']
